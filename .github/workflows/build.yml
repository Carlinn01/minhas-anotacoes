name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Chave de assinatura
        env:
          SIGNING_KEY_B64: ${{ secrets.SIGNING_KEY_B64 }}
        run: |
          if [ -n "$SIGNING_KEY_B64" ]; then
            echo "$SIGNING_KEY_B64" | base64 -d > app/release.jks
          fi

      - name: Compilar
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk MinhasAnotacoes.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MinhasAnotacoes
          path: MinhasAnotacoes.apk

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Minhas Anotações 1.0.${{ github.run_number }}
          body: Baixe o arquivo **MinhasAnotacoes.apk** abaixo no celular e instale.
          files: MinhasAnotacoes.apk
          make_latest: true
